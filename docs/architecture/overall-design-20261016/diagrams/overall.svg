<text x="900" y="1570" font-size="23" fill="#657a91" font-weight="400" text-anchor="middle">Tiền có thể đến trước hoặc sau giao hàng; mỗi mốc cần chủ chịu trách nhiệm và bằng chứng riêng.</text>
<text x="900" y="1611" font-size="23" fill="#657a91" font-weight="400" text-anchor="middle">AI đề xuất và thực hiện trong quyền; kết quả AI không tự xác nhận thu tiền hoặc hoàn thành nghiệp vụ.</text>
<text x="70" y="1706" font-size="23" fill="#687d95" font-weight="400" text-anchor="start">10 tầng là trách nhiệm logic, không phải 10 microservice/DB. Mũi tên là hợp đồng thiết kế, chưa chứng minh tích hợp live.</text>
<text x="70" y="1738" font-size="21" fill="#687d95" font-weight="400" text-anchor="start">Nguồn: ARCHITECTURE.md + CONTRACTS.md. Hình minh họa soạn từ cùng mô hình; Mermaid là nguồn sơ đồ chỉnh sửa được.</text>
