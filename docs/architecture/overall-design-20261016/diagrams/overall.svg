<title id="title">Kiến trúc tổng thể Business AI OS — thiết kế đề xuất, chưa triển khai</title>
<desc id="desc">Một ranh giới Business AI OS gồm sáu miền ngang hàng: Founder, Marketing, Sales CRM, Vận hành, Chăm sóc bảo hành, Tài chính đơn hàng. Mọi miền dùng chung L1 đến L10. Kênh bên ngoài qua tiếp nhận bền vững, Codex ở ngoài runtime.</desc>
