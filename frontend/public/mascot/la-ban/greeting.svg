  <path d="M129 27 a16 16 0 0 1 4 14" stroke="#fcd34d" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".45"/>
  <!-- thân -->
  <rect x="30" y="64" width="64" height="47" rx="18" fill="url(#body)"/>
  <!-- mặt la bàn trên ngực -->
  <circle cx="62" cy="88" r="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <path d="M62 79 L66 88 L58 88 Z" fill="#ef4444"/>
  <path d="M62 97 L66 88 L58 88 Z" fill="#cbd5e1"/>
