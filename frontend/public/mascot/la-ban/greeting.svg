  <!-- đầu -->
  <circle cx="62" cy="40" r="28" fill="url(#head)" stroke="#6366f1" stroke-width="3"/>
  <circle cx="32" cy="42" r="5" fill="#c7d2fe"/>
  <circle cx="92" cy="42" r="5" fill="#c7d2fe"/>
  <!-- mắt + miệng -->
  <circle cx="53" cy="39" r="4.2" fill="#1e293b"/>
  <circle cx="71" cy="39" r="4.2" fill="#1e293b"/>
  <circle cx="54.4" cy="37.6" r="1.3" fill="#ffffff"/>
  <circle cx="72.4" cy="37.6" r="1.3" fill="#ffffff"/>
  <path d="M55 50 q7 6 14 0" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="46" cy="48" rx="4" ry="2.6" fill="#fda4af" opacity=".55"/>
  <ellipse cx="78" cy="48" rx="4" ry="2.6" fill="#fda4af" opacity=".55"/>
