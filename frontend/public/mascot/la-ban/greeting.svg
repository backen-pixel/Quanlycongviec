<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 132" width="146" height="132" role="img" aria-label="Trợ lý vẫy tay chào">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
  </defs>
  <ellipse cx="62" cy="124" rx="30" ry="5" fill="#1e293b" opacity=".12"/>
  <!-- tay trái (phía người xem) -->
  <path d="M34 78 L18 84" stroke="#a5b4fc" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="16" cy="85" r="6.5" fill="#fcd34d"/>
