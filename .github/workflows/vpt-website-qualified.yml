name: VPT website qualified leads (isolated)
on:
  pull_request:
    paths:
      - 'backend/src/domain/websiteIntakeReceipt.js'
      - 'backend/src/domain/externalLeadTracking.js'
      - 'backend/src/modules/marketingAutomation/website*.js'
      - 'backend/src/modules/marketingAutomation/google*Conversions.js'
      - 'backend/src/modules/marketingAutomation/qualificationEvidence.js'
      - 'backend/src/helpers/crmStageQualificationWrite.js'
      - 'backend/src/helpers/supabaseReplication.js'
      - 'backend/scripts/recover-backup-user-parent-20261015.js'
      - 'backend/scripts/preserve-replication-cutover-20261015.js'
      - 'backend/src/routes/crm/routes/leadLifecycle.js'
      - 'backend/src/services/websiteQualifiedFeedback.js'
      - 'backend/src/routes/websiteFeedback.js'
      - 'backend/tests/website*'
      - 'backend/tests/google*Conversions.test.js'
      - 'backend/tests/crm-stage-qualification*'
      - 'backend/tests/supabase-replication-recovery.test.js'
      - 'backend/tests/backup-user-parent-recovery-sql.js'
      - 'backend/tests/replication-cutover-preservation-sql.js'
      - 'database/2026101400571*.sql'
      - 'database/20261014022725_website_intake_backup_compat.sql'
      - 'database/20261015020200_crm_stage_qualification_policy.sql'
      - 'database/20261015041536_vpt_bounded_recovery_private_snapshot.sql'
      - 'database/20261015045032_vpt_recovery_dedicated_snapshot_key_v2.sql'
      - 'database/20261015050417_replication_cutover_preservation.sql'
      - 'integrations/wordpress/vpt-v1-crm-bridge/**'
      - '.github/workflows/vpt-website-qualified.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install existing application dependencies without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --prefer-offline
      - name: Actual HTTP and pure source, consent and delivery regressions
        run: |
          node --test backend/tests/website-intake-receipt.js backend/tests/website-qualified-leads.js backend/tests/website-feedback-outbox.js backend/tests/website-feedback-service.js backend/tests/googleQualifiedConversions.test.js backend/tests/googleOfflineConversions.test.js backend/tests/crm-stage-qualification-write.test.js backend/tests/supabase-replication-recovery.test.js
          node --test integrations/wordpress/vpt-v1-crm-bridge/tests/test_attribution.cjs
          php -n -l integrations/wordpress/vpt-v1-crm-bridge/core.php
          php -n -l integrations/wordpress/vpt-v1-crm-bridge/vpt-v1-crm-bridge.php
          python3 integrations/wordpress/vpt-v1-crm-bridge/tests/test_core.py php
          git diff --check
      - name: Install isolated PostgreSQL runtime outside repository
        run: npm install --prefix "$RUNNER_TEMP/vpt-website-pg" --no-audit --ignore-scripts --no-save @electric-sql/pglite@0.5.9
      - name: Actual PostgreSQL receipt, RLS, lease and delivery SQL
        run: |
          node backend/tests/website-feedback-sql.js "$RUNNER_TEMP/vpt-website-pg/node_modules/@electric-sql/pglite"
          node backend/tests/website-backup-compat-sql.js "$RUNNER_TEMP/vpt-website-pg/node_modules/@electric-sql/pglite"
          node backend/tests/crm-stage-qualification-sql.js "$RUNNER_TEMP/vpt-website-pg/node_modules/@electric-sql/pglite"
          node backend/tests/backup-user-parent-recovery-sql.js "$RUNNER_TEMP/vpt-website-pg/node_modules/@electric-sql/pglite"
          node backend/tests/replication-cutover-preservation-sql.js "$RUNNER_TEMP/vpt-website-pg/node_modules/@electric-sql/pglite"
