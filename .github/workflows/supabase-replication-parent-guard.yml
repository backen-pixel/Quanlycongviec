name: Backup replication parent guard
on:
  pull_request:
    paths:
      - 'backend/src/helpers/supabaseReplication.js'
      - 'backend/tests/supabaseReplication.parentGuard.test.js'
      - '.github/workflows/supabase-replication-parent-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and isolated parent-link regressions
        run: |
          node --check backend/src/helpers/supabaseReplication.js
          node --check backend/tests/supabaseReplication.parentGuard.test.js
          node --test backend/tests/supabaseReplication.parentGuard.test.js
