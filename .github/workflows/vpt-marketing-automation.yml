  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test backend/tests/marketingAutomation.test.js backend/tests/marketingAutomation.leads.test.js backend/tests/marketingAutomation.reports.test.js backend/tests/marketingAutomation.spend.test.js backend/tests/marketingAutomation.spend.integration.test.js backend/tests/adAnalytics.correctness.test.js backend/tests/adAnalytics.ui-state.test.js backend/tests/adAnalytics.action-lifecycle.test.js backend/tests/crmLeadQuality.test.js backend/tests/crmLeadIdentity.test.js backend/tests/crmLeadIdentity.service.test.js backend/tests/crmLeadIdentity.review.test.js backend/tests/marketingAutomation.trial.test.js backend/tests/facebookLeadIntake.test.js backend/tests/facebookLeadIntake.integration.test.js backend/tests/facebookLeadIntake.admin.test.js backend/tests/facebookLeadCensus.test.js backend/tests/marketingAutomation.reconciliation.test.js backend/tests/marketingAutomation.period.test.js backend/tests/marketingAutomation.observedCpql.test.js backend/tests/marketingAutomation.sourceRegistry.test.js backend/tests/marketingAutomation.operations.test.js backend/tests/marketingAutomation.cohortOperations.test.js backend/tests/marketingAutomation.sourceExport.test.js backend/tests/marketingAutomation.measurementSnapshot.test.js backend/tests/marketingAutomation.accountDelivery.test.js backend/tests/marketingAutomation.scopeAcceptance.test.js backend/tests/facebookLeadIntake.legacy.test.js backend/tests/facebookCustomerCare.test.js backend/tests/facebookCustomerCare.console.test.js backend/tests/facebookCustomerCare.library.test.js backend/tests/facebookCustomerCare.libraryConsole.test.js backend/tests/surveyAvailability.test.js backend/tests/surveyProposals.test.js backend/tests/surveyProposalConsole.test.js backend/tests/facebookSurveyDispatch.test.js backend/tests/facebookSurveyOutcomes.test.js backend/tests/surveyHandoffs.test.js backend/tests/surveyHandoffs.ui-state.test.js
      - run: node --test backend/tests/careConnections.test.js backend/tests/careConnections.console.test.js
      - run: node --test backend/tests/facebookLegacyWriteScope.test.js backend/tests/facebookLegacyPhoneRepair.test.js backend/tests/facebookWebhookRecovery.test.js backend/tests/crmLegacyMergeAccess.test.js backend/tests/facebookLegacyCreationScope.test.js backend/tests/facebookLegacyBatch.test.js backend/tests/facebookLegacyBatch.ui.test.js backend/tests/facebookLegacySourceRepair.test.js backend/tests/facebookBatchJournal.test.js backend/tests/facebookBatchRecovery.ui.test.js backend/tests/facebookDuplicateReview.test.js backend/tests/facebookDuplicateReview.ui.test.js backend/tests/facebookBatchStop.test.js backend/tests/facebookBatchStop.ui.test.js
      - run: node --test backend/tests/facebookWorkerDrain.test.js backend/tests/workerShutdown.test.js backend/tests/facebookMessengerReceipt.test.js
      - run: node --test backend/tests/legacyProcessDrain.test.js
      - run: node --test backend/tests/facebookBatchLinkReconciliation.test.js
      - run: node --test backend/tests/facebookCustomerCare.advisor.test.js
      - run: node --test backend/tests/facebookCustomerCare.advisorConsole.test.js
      - run: node --test backend/tests/facebookCustomerCare.inference.test.js
      - run: node --test backend/tests/facebookCustomerCare.runtime.test.js backend/tests/facebookCustomerCare.runtimeConsole.test.js
      - run: node --test backend/tests/careAnswerDispatch.test.js backend/tests/careInferenceCosts.test.js
      - run: node --test backend/tests/marketingAutomation.coverage.test.js
      - name: Install isolated Express version matching backend lock
        run: npm install --prefix "$RUNNER_TEMP/vpt-http" --ignore-scripts --no-audit --no-fund express@5.2.1
      - name: Real Express post-ACK and stopped admission
        run: NODE_PATH="$RUNNER_TEMP/vpt-http/node_modules" VPT_EXPRESS_TEST=1 node --test backend/tests/trackedRouter.http.test.js
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketing_automation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test driver without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0
      - name: PostgreSQL rights, concurrency and crash recovery
        env:
          MARKETING_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/marketing_automation_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/marketingAutomation.postgres.test.js
  spend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketing_spend_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0
      - name: Spend publication, rights and parallel runs
        env:
          MARKETING_SPEND_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/marketing_spend_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/marketingAutomation.spend.postgres.test.js
  crm-quality-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_quality_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0
      - name: CRM qualification, current permissions and concurrent changes
        env:
          CRM_QUALITY_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/crm_quality_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/crmLeadQuality.postgres.test.js
  crm-identity-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_identity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0
      - name: CRM identity graph, source changes and concurrent writes
        env:
          CRM_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/crm_identity_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/crmLeadIdentity.postgres.test.js
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Build entire frontend without deployment preparation scripts
        run: npm exec -- vite build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
  facebook-lead-intake-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        security-baseline: ['legacy', '700']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fb_intake_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_restore:
        image: postgres:17
        env:
          POSTGRES_DB: fb_intake_restore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0
      - name: Signed Lead Ads intake, CRM transaction, permissions and leases
        env:
          FB_INTAKE_SECURITY_BASELINE: ${{ matrix.security-baseline }}
          FB_INTAKE_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/fb_intake_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/facebookLeadIntake.postgres.test.js
      - name: Logical backup and restore into a separate isolated cluster
        env:
          FB_INTAKE_SECURITY_BASELINE: ${{ matrix.security-baseline }}
          VPT_RESTORE_REHEARSAL: '1'
          VPT_RESTORE_TEST_PG_MAJOR: '17'
          FB_INTAKE_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/fb_intake_test
          FB_RESTORE_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5433/fb_intake_restore_test
          VPT_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          VPT_RESTORE_CONTAINER: ${{ job.services.postgres_restore.id }}
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/facebookRestore.postgres.test.js

  marketing-trial-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketing_trial_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0
      - name: Whole account trial, source, qualification, identity and concurrent snapshot
        env:
          MARKETING_TRIAL_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/marketing_trial_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/marketingAutomation.trial.postgres.test.js

  facebook-lead-census-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fb_census_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/vpt-pg" --ignore-scripts --no-audit --no-fund pg@8.19.0 express@5.2.1
      - name: Provider enumeration, crash recovery, intake and scope concurrency
        env:
          FB_CENSUS_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/fb_census_test
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/facebookLeadCensus.postgres.test.js

      - name: Source export HTTP body limit
        run: NODE_PATH="$RUNNER_TEMP/vpt-pg/node_modules" node --test backend/tests/marketingAutomation.sourceExport.http.test.js
