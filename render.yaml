services:
  # Backend — Web Service (also serves frontend)
  - type: web
    name: tubep-backend
    runtime: node
    rootDir: backend
    buildCommand: NODE_OPTIONS=--max-old-space-size=4096 npm run build:frontend && npm ci --prefer-offline --no-audit
    startCommand: npm start
    healthCheckPath: /api/health
    startTimeout: 120
    # Autoscaling (Render Pro+). Không có Pro: đặt numInstances thủ công trên Dashboard.
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
      targetMemoryPercent: 80
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: NODE_ENV
        value: production
      - key: FB_AUTO_PIPELINE_RESUME_ON_BOOT
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://tubep-frontend-s30w.onrender.com
      - key: CORS_ORIGINS
        value: https://tubep-frontend-s30w.onrender.com,https://tubep-backend.onrender.com
      - key: REDIS_URL
        sync: false
      - key: REDIS_DISABLED
        sync: false
      - key: PG_POOL_MAX
        value: "5"
      - key: FB_AUTO_PIPELINE_LEADER_TTL_SEC
        value: "180"
      - key: SUPABASE_FAILOVER_ENABLED
        value: "0"
      - key: SUPABASE_AUTO_FAILOVER
        value: "0"
      - key: SUPABASE_BACKUP_URL
        sync: false
      - key: SUPABASE_BACKUP_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BACKUP_DB_URL
        sync: false
      - key: SUPABASE_BACKUP_DB_DIRECT_URL
        sync: false
      - key: SUPABASE_HEALTH_INTERVAL_MS
        sync: false
      - key: SUPABASE_FAIL_THRESHOLD
        sync: false
      - key: SUPABASE_AUTO_FAILBACK
        value: "0"
      - key: SUPABASE_REPLICATION_ENABLED
        sync: false
      - key: SUPABASE_REPLICATION_SKIP_TABLES
        sync: false
      - key: SUPABASE_REPLICATION_LIGHT
        sync: false
      - key: SUPABASE_REPLICATION_STORAGE
        sync: false
      - key: SUPABASE_REPLICATION_IDLE_POLL_MS
        sync: false
      - key: SUPABASE_REPLICATION_BATCH_SIZE
        sync: false
      - key: SUPABASE_MONITOR_PASSWORD
        sync: false
      - key: SUPABASE_BACKUP_SYNC_SCHEDULE_ENABLED
        sync: false
      - key: SUPABASE_BACKUP_SYNC_SLOTS_VN
        sync: false
      - key: SUPABASE_BACKUP_SYNC_CRON_MS
        sync: false
      - key: SUPABASE_FAILBACK_SKIP_TABLES
        sync: false
      - key: SUPABASE_SWITCH_SYNC_ROUNDS
        sync: false
      - key: SUPABASE_SWITCH_SYNC_INTERVAL_MS
        sync: false
      - key: SUPABASE_SWITCH_SYNC_MAX_MS
        sync: false
      - key: SUPABASE_SWITCH_LOG_ENABLED
        sync: false
      - key: SUPABASE_QUICK_SWITCH_COUNTDOWN_MS
        sync: false
      - key: SUPABASE_SWITCH_COUNTDOWN_MS
        sync: false
      - key: FCM_SA_JSON
        sync: false
