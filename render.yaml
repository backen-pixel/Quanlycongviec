services:
  # Backend — Web Service
  - type: web
    name: tubep-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --prefer-offline --no-audit
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Frontend — Static Site
  - type: web
    name: tubep-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --prefer-offline --no-audit && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
