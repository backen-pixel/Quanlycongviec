services:
  # Backend — Web Service (also serves frontend)
  - type: web
    name: tubep-backend
    runtime: node
    rootDir: backend
    buildCommand: npm run build:frontend && npm ci --prefer-offline --no-audit
    startCommand: npm start
    healthCheckPath: /api/health
    startTimeout: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: FB_AUTO_PIPELINE_RESUME_ON_BOOT
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FCM_SA_JSON
        sync: false
