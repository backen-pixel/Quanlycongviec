services:
  # Backend — Web Service (also serves frontend)
  - type: web
    name: tubep-backend
    runtime: node
    rootDir: ./
    buildCommand: cd frontend && npm ci --prefer-offline --no-audit && npm run build && cd ../backend && npm ci --prefer-offline --no-audit
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
