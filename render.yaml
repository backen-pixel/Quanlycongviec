services:
  # Backend — Web Service (also serves frontend)
  - type: web
    name: tubep-backend
    runtime: node
    rootDir: backend
    buildCommand: npm run build:frontend && npm ci --prefer-offline --no-audit
    startCommand: npm start
    healthCheckPath: /api/health
    startTimeout: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: FB_AUTO_PIPELINE_RESUME_ON_BOOT
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_DISABLED
        sync: false
      - key: SUPABASE_FAILOVER_ENABLED
        sync: false
      - key: SUPABASE_BACKUP_URL
        sync: false
      - key: SUPABASE_BACKUP_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BACKUP_DB_URL
        sync: false
      - key: SUPABASE_BACKUP_DB_DIRECT_URL
        sync: false
      - key: SUPABASE_HEALTH_INTERVAL_MS
        sync: false
      - key: SUPABASE_FAIL_THRESHOLD
        sync: false
      - key: SUPABASE_AUTO_FAILBACK
        sync: false
      - key: SUPABASE_REPLICATION_ENABLED
        sync: false
      - key: SUPABASE_REPLICATION_SKIP_TABLES
        sync: false
      - key: SUPABASE_REPLICATION_LIGHT
        sync: false
      - key: SUPABASE_REPLICATION_STORAGE
        sync: false
      - key: SUPABASE_REPLICATION_IDLE_POLL_MS
        sync: false
      - key: SUPABASE_REPLICATION_BATCH_SIZE
        sync: false
      - key: SUPABASE_MONITOR_PASSWORD
        sync: false
      - key: SUPABASE_FAILBACK_SKIP_TABLES
        sync: false
      - key: SUPABASE_SWITCH_SYNC_ROUNDS
        sync: false
      - key: SUPABASE_SWITCH_SYNC_INTERVAL_MS
        sync: false
      - key: SUPABASE_SWITCH_SYNC_MAX_MS
        sync: false
      - key: FCM_SA_JSON
        sync: false
