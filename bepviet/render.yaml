# Render Blueprint cho website Bep Viet (Static Site, chi frontend).
#
# Cach 1 — Blueprint: copy file nay ra goc repo (hoac tach repo rieng),
#          Render > New > Blueprint > chon nhanh feat/web-ban-hang-tu-bep.
# Cach 2 — Thu cong: Render > New > Static Site, dien dung cac gia tri ben duoi
#          (Root Directory = bepviet). Xem DEPLOY.md.
services:
  - type: web
    name: bepviet-web
    runtime: static
    rootDir: bepviet
    branch: feat/web-ban-hang-tu-bep
    buildCommand: npm ci --prefer-offline --no-audit && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    # SPA: moi duong dan deu tra ve index.html de React Router xu ly.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
